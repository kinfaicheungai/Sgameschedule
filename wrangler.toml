name = "sgameschedule"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Check every minute for reminders due (free plan allows this).
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[vars]
